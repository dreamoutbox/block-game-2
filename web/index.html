<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Block Game 2</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <script type="module">
    import init from "./pkg/block-game-2.js";
    init().catch((e) => {
      // Bevy uses an exception to unwind out of the winit event loop; ignore it.
      if (!String(e).includes("Using exceptions for control flow")) throw e;
    });
  </script>
</body>
</html>
