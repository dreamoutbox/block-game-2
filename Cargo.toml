[package]
name = "block-game-2"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
bevy_egui = "0.43.1"
bincode = "1.3"
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"

# Optimize dependencies in dev mode for smooth 60+ FPS in voxel rendering
[profile.dev.package."*"]
opt-level = 3

# Moderate optimization for game code in dev
[profile.dev]
opt-level = 1

# Maximum optimization in release
[profile.release]
opt-level = 3
lto = "thin"

