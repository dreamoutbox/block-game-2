[package]
name = "block-game-2"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9.0"
thiserror = "2.0"

# Optimize dependencies in dev mode for smooth 60+ FPS in voxel rendering
[profile.dev.package."*"]
opt-level = 3

# Moderate optimization for game code in dev
[profile.dev]
opt-level = 1

# Maximum optimization in release
[profile.release]
opt-level = 3
lto = "thin"
